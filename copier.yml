# Copier configuration for MEDS_model_template.
# Docs: https://copier.readthedocs.io
#
# Generates a MEDS model repository exposing the mandated `meds-model <step>` CLI. Run with:
#   copier copy gh:mmcdermott/MEDS_model_template ./my-model      # or a local path
# and later, to pull template updates into an existing repo:
#   copier update

# ----------------------------------------------------------------------------------------------------
# Copier engine settings
# ----------------------------------------------------------------------------------------------------
_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_envops:
  # Match the Jinja settings Copier recommends; keep whitespace predictable in rendered Python/YAML.
  keep_trailing_newline: true

# Files the user is expected to hand-edit: never overwritten by `copier update`.
_skip_if_exists:
  - "src/{{ model_slug }}/model.py"
  - "src/{{ model_slug }}/commands.py"
  - "src/{{ model_slug }}/predict.py"
  - "src/{{ model_slug }}/configs/model/**"
  - "src/{{ model_slug }}/configs/paths/**"
  - "src/{{ model_slug }}/configs/profile/**"

_exclude:
  - "*.pyc"
  - "__pycache__"
  - ".git"
  - ".mypy_cache"
  - ".pytest_cache"

# Post-generation tasks (run only on first `copy`, not on `update`). Kept minimal — no heavy install is
# auto-run; the message below tells the user to `uv sync`. Requires `copier copy --trust`.
_tasks:
  - command: "git init -q"
    when: "{{ _copier_operation == 'copy' }}"
  # Best-effort tidy of the rendered code (import order / formatting). Self-contained via uvx; skipped
  # cleanly if offline. The result is what CI's `ruff check` / `ruff format --check` then verify.
  - command: "uvx ruff check --fix --quiet . 2>/dev/null || true"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uvx ruff format --quiet . 2>/dev/null || true"
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |
  ✅ Created '{{ model_name }}' ({{ profile }} profile).

  Next steps:
    cd {{ _copier_conf.dst_path }}
    uv sync --all-extras               # install dependencies
    uv run pre-commit install          # (optional) enable pre-commit hooks
    uv run meds-model commands         # list the commands this model supports
    uv run pytest -m "not slow"        # smoke tests

_message_after_update: |
  ✅ Updated '{{ model_name }}' to the latest template.
  Review changes to src/meds_model_base/ (the vendored contract), then run `uv run pytest -m "not slow"`.

# ----------------------------------------------------------------------------------------------------
# Questions
# ----------------------------------------------------------------------------------------------------
model_name:
  type: str
  help: "Human-readable model name (e.g. 'GRU Sequence Model')"
  default: "My MEDS Model"

model_slug:
  type: str
  help: "Python package name (lowercase, underscores; must be a valid importable module)"
  default: "{{ model_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not (model_slug | regex_search('^[a-z][a-z0-9_]*$')) %}
    'model_slug' must be lowercase letters/digits/underscores and start with a letter.
    {% endif %}

model_description:
  type: str
  help: "One-line description of the model"
  default: "A MEDS model generated from MEDS_model_template."

author_name:
  type: str
  help: "Author name"
  default: "Your Name"

author_email:
  type: str
  help: "Author email"
  default: "you@example.com"

python_version:
  type: str
  help: "Minimum supported Python version"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
  default: "3.12"

profile:
  type: str
  help: "Which DAG of commands this model implements (the model itself is yours to write)"
  choices:
    "supervised — preprocess_data, supervised_train, predict": "supervised"
    "finetune — pretrain, then supervised_train from the pretrained model": "finetune"
    "probe — pretrain, infer embeddings, train a head on the frozen features": "probe"
    "zero_shot_direct — pretrain, then score a task straight from the model": "zero_shot_direct"
    "zero_shot_materialized — pretrain, infer scores, then score a task from those artifacts": "zero_shot_materialized"
    "packaged — weights ship with the repo; predict only (PFN-style)": "packaged"
    "custom — choose each command yourself": "custom"
  default: "supervised"

# Command toggles, only *asked* for the custom profile. `preprocess_data` is always supported: every
# chain starts by materializing patient data. Tasks are not a stage — commands take external_labels_dir.
implements_pretrain:
  type: bool
  help: "Support the `pretrain` command (foundation-model pretraining)?"
  default: "{{ profile in ['finetune', 'probe', 'zero_shot_direct', 'zero_shot_materialized'] }}"
  when: "{{ profile == 'custom' }}"

implements_infer:
  type: bool
  help: "Support the `infer` command (materialize embeddings / trajectories / scores)?"
  default: "{{ profile in ['probe', 'zero_shot_materialized'] }}"
  when: "{{ profile == 'custom' }}"

implements_supervised_train:
  type: bool
  help: "Support the `supervised_train` command?"
  default: "{{ profile in ['supervised', 'finetune', 'probe'] }}"
  when: "{{ profile == 'custom' }}"

implements_predict:
  type: bool
  help: "Support the `predict` command? (required for MEDS-DEV)"
  default: true
  when: "{{ profile == 'custom' }}"

# Logger options. Each renders `configs/logger/<name>.yaml` *and* the matching `pyproject.toml` extra, so
# answering yes is what makes `logger=<name>` a valid override; answering no leaves `csv` the only member
# of the group, and `logger=wandb` is then a Hydra composition error rather than a missing dependency.
# `configs/logger/` is not in `_skip_if_exists`, so flipping an answer and re-running `copier update`
# backfills the config later.
use_wandb:
  type: bool
  help: "Render configs/logger/wandb.yaml + the `wandb` extra (needed to run `logger=wandb`)?"
  default: false

use_mlflow:
  type: bool
  help: "Render configs/logger/mlflow.yaml + the `mlflow` extra (needed to run `logger=mlflow`)?"
  default: false
