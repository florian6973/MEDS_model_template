_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

model_name:
  type: str
  default: Minimal MEDS Model

model_slug:
  type: str
  default: "{{ model_name | lower | replace(' ', '_') | replace('-', '_') }}"

profile:
  type: str
  choices:
    - supervised
    - finetune
    - probe
    - zero_shot_direct
    - zero_shot_materialized
    - packaged
  default: supervised

model_description:
  type: str
  default: "{{ model_name }} implemented against the minimal MEDS model contract."

author_name:
  type: str
  default: Model Author

author_email:
  type: str
  default: author@example.com

uses_predicates:
  type: bool
  default: false

implementation_source:
  type: str
  default: ""
  help: Paper path/URL, source repository path/URL, or both.
