repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # `uv.lock` for a torch + lightning + polars dependency tree runs well past the 500 KB default,
        # and a lockfile belongs in version control. Checkpoints are excluded by .gitignore, not here.
        args: ["--maxkb=2000"]
