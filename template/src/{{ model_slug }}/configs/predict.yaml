# @package _global_
# predict: produce standardized predictions for a task.
# Exactly one of the three sources below must be supplied, unless this model ships packaged weights.
# Ground truth is never read: only (subject_id, prediction_time) are taken from the task.
defaults:
  - paths: default
  - datamodule: task
  - model: default
  - trainer: default
  - optimizer: adamw
  - _self_
  - profile: default

#: Optional: when omitted it is recovered from the source artifact's manifest, which is what lets a
#: caller point only at a model whose workspace lives elsewhere.
input_data_dir: null

#: A MEDS labels directory: any arrangement of *.parquet carrying
#: (subject_id, prediction_time, boolean_value). `meds-dev-task` writes train/0.parquet,
#: tuning/0.parquet, held_out/0.parquet -- those names are input *shard* names, not splits, and are
#: not read as such: which split a subject belongs to comes from the tokenized cohort in
#: input_data_dir. Dot-directories (meds-dev-task's .logs/) are skipped.
#: The model only ever sees (subject_id, prediction_time): boolean_value is dropped before the
#: batch is built, so it cannot read the answer it is about to be scored against.
external_labels_dir: ???

output_predictions_dir: ${predictions_dir}

#: Join boolean_value onto the finished predictions, *after* the model has run. meds-evaluation scores a
#: predictions file in isolation and rejects one without it, so this defaults on; set false for a file
#: that carries no ground truth at all.
attach_labels: true

#: Mutually exclusive prediction sources.
input_supervised_model_dir: null
input_pretrained_model_dir: null
input_inference_subdir: null

#: Which splits to score; null means every split present in the task. Coverage of the selected splits is
#: enforced — a model that cannot score every timepoint fails rather than writing a short file.
splits: null

max_seq_len: 256
batch_size: 32
num_workers: 0

do_overwrite: false

hydra:
  run: {dir: "${log_dir}/predict"}
  job: {chdir: false}
