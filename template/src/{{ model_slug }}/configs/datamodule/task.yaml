defaults:
  - config: MEDSTorchDataConfig
  - _self_

# Task-conditioned view of the cohort: one sample per (subject_id, prediction_time), with the sequence
# ending at that timepoint (TO_END). Used by supervised_train, infer and predict.
#
# `task_labels_dir` is deliberately null here and set at runtime: the command materializes
# external_labels_dir into its own work directory first, and that path is derived from the output
# directory rather than expressible in config.
_target_: meds_torchdata.extensions.lightning_datamodule.Datamodule
config:
  tensorized_cohort_dir: ${input_data_dir}/patients
  task_labels_dir: null
  max_seq_len: ${max_seq_len}
  seq_sampling_strategy: TO_END
  static_inclusion_mode: OMIT
batch_size: ${batch_size}
num_workers: ${num_workers}
